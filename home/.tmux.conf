set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features 'ghostty*:extkeys'
set -g base-index 1
set -g pane-base-index 1
set -g focus-events on

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

set -g mouse on
set -g mode-keys vi
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'o0th/tmux-nova'

# Shared Nova layout and Tokyo Night fallback palette. Machine-local settings
# are sourced below so each machine can override any @nova-* option.
set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left ''
set -g @nova-nerdfonts-right ''
set -g @nova-pane '#I#{?pane_in_mode,  #{pane_mode},}  #W'
set -g @nova-pane-justify 'centre'
set -g @nova-rows 0
set -g status-left-length 100
set -g status-right-length 100

set -g @nova-segment-mode '#{?client_prefix,PREFIX,TMUX}'
set -g @nova-segment-mode-colors '#BB9AF7 #1A1B26'
set -g @nova-segment-session '#S'
set -g @nova-segment-session-colors '#E0AF68 #1A1B26'
set -g @nova-segment-directory '#{b:pane_current_path}'
set -g @nova-segment-directory-colors '#9ECE6A #1A1B26'
set -g @nova-segment-clock '%H:%M'
set -g @nova-segment-clock-colors '#7DCFFF #1A1B26'
set -g @nova-segments-0-left 'mode session'
set -g @nova-segments-0-right 'directory clock'

set -g @nova-message-command-style-bg '#7AA2F7'
set -g @nova-message-command-style-fg '#1A1B26'
set -g @nova-message-style-bg '#24283B'
set -g @nova-message-style-fg '#C0CAF5'
set -g @nova-mode-style-bg '#E0AF68'
set -g @nova-mode-style-fg '#1A1B26'
set -g @nova-status-style-bg '#1A1B26'
set -g @nova-status-style-fg '#C0CAF5'
set -g @nova-status-style-active-bg '#7AA2F7'
set -g @nova-status-style-active-fg '#1A1B26'
set -g @nova-status-activity-fg '#F7768E'
set -g @nova-pane-border-style '#24283B'
set -g @nova-pane-active-border-style '#7DCFFF'

set -g pane-border-lines "double"
set -g pane-border-status "top"

if-shell '[ -f "$HOME/.config/tmux/local.conf" ]' \
  'source-file "$HOME/.config/tmux/local.conf"'

run '~/.tmux/plugins/tpm/tpm'
